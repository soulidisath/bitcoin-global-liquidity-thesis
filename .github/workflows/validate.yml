name: Validate thesis research utilities

on:
  push:
    paths-ignore:
      - 'staging/**'
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python examples/synthetic_smoke.py
